name: Processar, validar e publicar os dados
description: >
  Executa a conciliação, os indicadores, os alertas e o resumo diário, valida
  tudo e faz o commit apenas quando existe alteração real de dados.

inputs:
  label:
    description: Rótulo usado na mensagem de commit
    required: true

outputs:
  changed:
    description: "'true' quando houve commit"
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Processar dados
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
      run: |
        set -euo pipefail
        python3 scripts/reconcile_reserves.py
        python3 scripts/calculate_indicators.py
        python3 scripts/generate_alerts.py
        python3 scripts/generate_daily_summary.py

    - name: Validar antes de publicar
      shell: bash
      run: python3 scripts/validate_data.py

    - name: Commitar apenas se houver dado novo
      id: commit
      shell: bash
      run: |
        set -euo pipefail
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A data

        # O arquivo de estado da coleta muda de carimbo de hora a cada
        # execucao. Se ele for a unica alteracao, nada de novo foi publicado e
        # o commit e descartado, para nao poluir o historico.
        changed_files="$(git diff --cached --name-only)"
        if [ -z "$changed_files" ]; then
          echo "nenhuma alteracao"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$changed_files" = "data/metadata/collection-state.json" ]; then
          echo "apenas o carimbo de hora da coleta mudou; descartando"
          git reset -q
          git checkout -- data/metadata/collection-state.json
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "$changed_files"
        git commit -m "dados: ${{ inputs.label }}

        $(echo "$changed_files" | head -20)"
        for attempt in 1 2 3 4 5; do
          if git push; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "push falhou, tentativa $attempt"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          sleep $((attempt * 5))
        done
        echo "nao foi possivel publicar o commit" >&2
        exit 1
