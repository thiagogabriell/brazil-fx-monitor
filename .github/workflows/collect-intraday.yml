name: Coleta intradiária (câmbio e reservas)

# Esta é a rotina que mantém a página perto do tempo real. Ela lê os comunicados
# de leilão que o Banco Central publica no mesmo dia, além da PTAX e do saldo
# das reservas. Roda a cada 30 minutos em dias úteis, no horário em que há
# publicação, porque o botão "Atualizar agora" da página depende de CORS e o
# CDN do Banco Central não é confiável nesse ponto; esta coleta não depende de
# CORS e é a garantia de que o dado chega.
on:
  schedule:
    # A cada 30 minutos nos dias úteis, das 08h às 19h em São Paulo. Os leilões
    # de câmbio acontecem de manhã e os comunicados saem minutos depois, então
    # esta é a janela em que existe dado novo para buscar. Fora dela não roda.
    - cron: '*/30 11-22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.process.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Pular feriados bancários brasileiros
        id: guard
        run: |
          set -euo pipefail
          today=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          if grep -qx "$today" .github/holidays-br.txt; then
            echo "feriado bancario em $today; nada a coletar"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Coletar câmbio, reservas e leilões do dia
        if: steps.guard.outputs.skip == 'false'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python3 scripts/collect_exchange_rates.py
          python3 scripts/collect_reserves.py
          python3 scripts/collect_recent_auctions.py

      - name: Processar e publicar
        id: process
        if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/process
        with:
          label: coleta intradiária de câmbio e reservas

  deploy:
    needs: collect
    # Em execucao manual publica mesmo sem dado novo, o que permite
    # revalidar a publicacao sem esperar uma mudanca de dados.
    if: needs.collect.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
