name: Publicar no GitHub Pages

# Publica o site estático. É chamado pelas rotinas de coleta logo após um
# commit de dados, porque commits feitos com o GITHUB_TOKEN não disparam
# outros workflows por si.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pages/**'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  # actions:read permite ao deploy-pages localizar o artefato pela API de
  # Actions, inclusive quando este workflow e chamado por outro com `uses:`.
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Montar o pacote do site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r index.html pages assets data _site/
          cp README.md _site/ 2>/dev/null || true
          # Impede que o Jekyll ignore diretorios iniciados por underscore.
          touch _site/.nojekyll
          # Conteudo minimo que precisa existir para o site funcionar.
          for required in index.html assets/js/core.js data/indicators/summary.json; do
            test -s "_site/$required" || { echo "faltando $required" >&2; exit 1; }
          done
          echo "arquivos publicados: $(find _site -type f | wc -l)"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      # O upload termina com "Finalizing artifact upload" e o deploy consulta a
      # API de artefatos menos de um segundo depois. Quando a finalizacao ainda
      # nao propagou, a consulta devolve zero artefatos e o deploy falha com
      # "No artifacts named github-pages were found". Esperar o artefato
      # aparecer elimina essa corrida.
      - name: Aguardar o artefato ficar visível na API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          for attempt in $(seq 1 20); do
            found=$(gh api "$api" --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "${found:-0}" -ge 1 ]; then
              echo "artefato disponível após $attempt tentativa(s)"
              exit 0
            fi
            echo "tentativa $attempt: artefato ainda não visível"
            sleep 6
          done
          echo "o artefato github-pages não ficou visível na API" >&2
          exit 1

      # Mesmo depois de a API de Actions listar o artefato, o servico interno
      # usado pelo deploy ainda pode nao te-lo propagado. Esperar um pouco e,
      # se ainda assim falhar, tentar de novo cobre essa janela.
      - name: Dar tempo de propagação
        run: sleep 25

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Esperar antes da segunda tentativa
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "primeira tentativa de publicação falhou; repetindo"
          sleep 40

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Validar a URL publicada
        if: steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success'
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}"
          echo "verificando $url"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/page.html -w '%{http_code}' --max-time 30 "$url" || echo 000)
            # Marcadores estaveis: o carregador comum a todas as paginas e o
            # titulo da pagina inicial. Nao depende de texto editorial.
            if [ "$code" = "200" ] \
               && grep -q "assets/js/core.js" /tmp/page.html \
               && grep -q "Reservas do Brasil" /tmp/page.html; then
              data_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                "${url}data/indicators/summary.json" || echo 000)
              echo "pagina $code, dados $data_code"
              [ "$data_code" = "200" ] && exit 0
            fi
            echo "tentativa $attempt: HTTP $code"
            sleep 20
          done
          echo "a URL publicada nao respondeu como esperado" >&2
          exit 1
