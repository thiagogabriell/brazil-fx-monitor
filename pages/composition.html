<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Composição das reservas · Brazil FX Monitor</title>
<meta name="description" content="Monitoramento das reservas internacionais do Brasil, das intervenções cambiais do Banco Central, do fluxo de dólares e da pressão sobre o real, com dados oficiais.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/app.css?v=c307114aca">
</head>
<body>
<div id="app-shell"></div>
<template id="page-template">
<p class="page-intro">
  Onde estão alocados os recursos que compõem as reservas internacionais
  brasileiras, segundo o que o Banco Central efetivamente divulga.
</p>

<div id="availability-notice"></div>

<div class="grid grid--2">
  <section class="section" style="margin-top:0">
    <div class="section__head"><h2>Distribuição por moeda</h2>
      <span class="badge badge--unavailable">Indisponível em API</span></div>
    <div class="section__body section__body--flush">
      <div class="table-wrap">
        <table class="data">
          <thead><tr>
            <th scope="col">Moeda</th><th scope="col" class="right">Valor em dólares</th>
            <th scope="col" class="right">% das reservas</th>
            <th scope="col">Data de referência</th><th scope="col">Situação</th>
          </tr></thead>
          <tbody id="currency-body"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="section" style="margin-top:0">
    <div class="section__head"><h2>Distribuição por classe de ativo</h2>
      <span class="badge badge--unavailable">Indisponível em API</span></div>
    <div class="section__body section__body--flush">
      <div class="table-wrap">
        <table class="data">
          <thead><tr>
            <th scope="col">Classe de ativo</th><th scope="col" class="right">Valor em dólares</th>
            <th scope="col" class="right">% das reservas</th>
            <th scope="col" class="right">Quantidade original</th>
            <th scope="col">Situação</th>
          </tr></thead>
          <tbody id="asset-body"></tbody>
        </table>
      </div>
    </div>
  </section>
</div>

<section class="section">
  <div class="section__head"><h2>Ativo utilizado em cada intervenção</h2></div>
  <div class="section__body">
    <p class="card__meta-row" id="asset-usage-note"></p>
    <div class="table-wrap" style="margin-top:10px">
      <table class="data">
        <caption>Operações cuja modalidade publicada identifica a classe de ativo.</caption>
        <thead><tr>
          <th scope="col">Data</th><th scope="col">Tipo</th><th scope="col">Modalidade</th>
          <th scope="col">Moeda</th><th scope="col">Classe de ativo</th>
          <th scope="col" class="right">Valor negociado</th><th scope="col">Fonte</th>
        </tr></thead>
        <tbody id="asset-usage-body"></tbody>
      </table>
    </div>
  </div>
</section>

<section class="section">
  <div class="section__head"><h2>Evolução do total das reservas</h2>
    <div class="topbar__spacer"></div><div id="composition-range"></div></div>
  <div class="section__body">
    <div class="chart" id="chart-total"></div>
    <p class="card__meta-row" style="margin-top:8px">
      Só o total é publicado como série temporal. A abertura por moeda e por classe
      de ativo existe apenas nos relatórios em PDF, com periodicidade anual.
    </p>
  </div>
</section>

<section class="section">
  <div class="section__head"><h2>Fontes oficiais da composição</h2></div>
  <div class="section__body"><ul class="plain" id="official-sources"></ul></div>
</section>
</template>
<script defer src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js" integrity="sha384-Mx5lkUEQPM1pOJCwFtUICyX45KNojXbkWdYhkKUKsbv391mavbfoAmONbzkgYPzR" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script defer src="../assets/js/core.js?v=c307114aca"></script>
<script defer src="../assets/js/charts.js?v=c307114aca"></script>
<script defer src="../assets/js/page-composition.js?v=c307114aca"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var start = function () {
    if (!window.BFX) { setTimeout(start, 20); return; }
    BFX.init('composition', "Composição das reservas").then(function () {
      if (window.PAGE && typeof window.PAGE.init === 'function') {
        window.PAGE.init().catch(function (error) {
          var main = document.getElementById('main');
          if (main) {
            var box = document.createElement('p');
            box.className = 'notice notice--error';
            box.textContent = 'Falha ao carregar os dados desta página: ' + error.message;
            main.prepend(box);
          }
          console.error(error);
        });
      }
    });
  };
  start();
});
</script>
</body>
</html>
