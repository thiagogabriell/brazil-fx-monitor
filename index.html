<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservas do Brasil</title>
<meta name="description" content="Quanto o Brasil tem de reservas internacionais, quanto mudou em cada dia e quanto o Banco Central vendeu, com dados oficiais.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/css/app.css?v=d630c59ab8">
<link rel="stylesheet" href="./assets/css/simple.css?v=d630c59ab8">
</head>
<body class="simple">
<main id="main"></main>
<template id="page-template">
<div class="simple-top">
  <h1>Quanto o governo está gastando das reservas de dólar</h1>
  <span class="usd" id="usd">buscando o dólar…</span>
  <span class="spacer"></span>
  <span style="font-size:11px;color:var(--text-dim)" id="checked"></span>
  <button class="btn btn--icon" id="theme-toggle" aria-label="Alternar tema">☀</button>
</div>

<div class="headline" id="headline">
  <p class="loading">Carregando os dados do Banco Central…</p>
</div>

<p class="lag" id="lag"></p>

<div class="day-controls">
  <label class="toggle-row">
    <input type="checkbox" id="only-spending" checked>
    Mostrar só os dias em que houve gasto
  </label>
  <span class="spacer"></span>
  <span style="font-size:11.5px;color:var(--text-dim)" id="row-count"></span>
  <button class="btn" type="button" id="export">Baixar CSV</button>
</div>

<div class="day-controls" id="day-buttons" hidden>
  <span style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)">Mostrar</span>
  <button class="btn" type="button" data-days="7">7 dias</button>
  <button class="btn" type="button" data-days="30">30 dias</button>
  <button class="btn" type="button" data-days="90">90 dias</button>
  <button class="btn" type="button" data-days="540">tudo</button>
</div>

<div style="overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)">
  <table class="simple">
    <thead>
      <tr>
        <th scope="col">Dia</th>
        <th scope="col">Gasto das reservas</th>
        <th scope="col">Quanto ainda tinha</th>
        <th scope="col">Mudança do saldo no dia</th>
        <th scope="col">Empréstimo (volta depois)</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="5" class="loading">Carregando…</td></tr></tbody>
  </table>
</div>

<div class="foot">
  <span><strong style="color:var(--text-muted)">Gasto das reservas</strong>: o Banco
    Central vendeu dólar de vez. Esse dinheiro saiu e não volta.</span>
  <span><strong style="color:var(--text-muted)">Mudança do saldo no dia</strong>: sobe
    e desce sozinho por rendimento e por variação entre as moedas guardadas.
    <em>Não é gasto.</em></span>
  <span><strong style="color:var(--text-muted)">Empréstimo</strong>: o Banco Central
    empresta dólar e recebe de volta na data combinada. Também não é gasto.</span>
</div>

<div class="foot">
  <span>Fontes: Banco Central do Brasil, séries SGS 13621 e 1 e o conjunto de dados
    de atuações no mercado de câmbio. Dólar ao vivo de fonte de mercado.</span>
  <span><a href="pages/reserves.html">Ver tudo em detalhe</a></span>
</div>
</template>
<script defer src="./assets/js/core.js?v=d630c59ab8"></script>
<script defer src="./assets/js/page-home.js?v=d630c59ab8"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var start = function () {
    if (!window.BFX) { setTimeout(start, 20); return; }
    BFX.initStandalone().then(function () {
      window.PAGE.init().catch(function (error) {
        var box = document.createElement('p');
        box.className = 'notice notice--error';
        box.textContent = 'Falha ao carregar os dados: ' + error.message;
        document.getElementById('main').prepend(box);
        console.error(error);
      });
    });
  };
  start();
});
</script>
</body>
</html>
